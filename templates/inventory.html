{% extends "base.html" %}
{% block title %}Inventory{% endblock %}
{% block main %}
<h1>Inventory</h1>
<div class="grid">
{% for product in products %}
<article>
  <h2>{{ product.name }}</h2>
  <form method="post" action="{{ url_for('update_product', product_id=product.id) }}" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Price in cents <input name="price" type="number" min="1" max="99999999" value="{{ product.price }}" required></label>
    <label>Stock <input name="stock" type="number" min="0" max="999999" value="{{ product.stock }}" required></label>
    <button>Save {{ product.name }}</button>
  </form>
</article>
{% endfor %}
</div>
{% endblock %}
