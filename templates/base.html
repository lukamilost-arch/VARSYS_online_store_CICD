<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shop{% endblock %} | Fieldstore</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><nav aria-label="Main navigation">
  <a class="brand" href="{{ url_for('catalog') }}">Fieldstore</a>
  {% if g.user %}
    {% if g.user.role == 'admin' %}
      <a href="{{ url_for('inventory') }}">Inventory</a>
    {% else %}
      <a href="{{ url_for('orders') }}">My orders</a>
    {% endif %}
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="quiet">Sign out</button>
    </form>
  {% else %}
    <a href="{{ url_for('login') }}">Sign in</a>
  {% endif %}
</nav></header>
<main>
  {% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
  {% block main %}{% endblock %}
</main>
</body>
</html>
